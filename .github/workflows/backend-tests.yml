# Tests du backend labo0 : bloque toute regression (test en echec ou
# couverture sous le seuil) sur les push et pull requests.
name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "labo0/backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "labo0/backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labo0/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Meme version que l'image Docker (python:3.12-slim)
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            labo0/backend/requirements.txt
            labo0/backend/requirements-dev.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        # Echec si un test casse ou si la couverture passe sous 90 %
        run: >
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: labo0/backend/coverage.xml
          if-no-files-found: ignore
