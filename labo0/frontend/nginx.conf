# Dashboard gridd : fichiers statiques + proxy vers le backend.
# Le navigateur ne parle qu'a nginx ; /api et /ws sont relayes au service
# backend du docker-compose (meme origine -> pas de CORS).

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA : toute route inconnue sert index.html
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://gridd-kafka-consumer:8000;
        proxy_set_header Host $host;
    }

    # WebSocket : headers d'upgrade + timeout long (flux continu)
    location /ws/ {
        proxy_pass http://gridd-kafka-consumer:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
