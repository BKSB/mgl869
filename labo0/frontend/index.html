<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Console temps réel des capteurs IoT du campus (gridd)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9f9f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>gridd — Capteurs du campus</title>
    <script>
      // Theme applique avant le module (aucun flash) ; cle et couleurs : cf. useTheme.ts
      (function () {
        var el = document.documentElement, t = null;
        try { t = localStorage.getItem('gridd.theme'); } catch (e) {}
        if (t === 'light' || t === 'dark') el.dataset.theme = t;
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0d0d0d' : '#f9f9f7');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
